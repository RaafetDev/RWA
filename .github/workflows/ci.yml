name: RitaWapp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup MinGW-w64 GCC
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Purity Tripwire Check
        run: deno task doctor --deno-only

      - name: Type Check
        run: deno task check

      - name: Run Test Suite
        run: deno task test

      - name: Compile Release Executable
        run: deno task build

      - name: Run Benchmarks
        run: deno task bench

      - name: Verify Distributable Package
        run: deno task packed

      - name: Upload Distributable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ritawapp-distributable
          path: dist/package/
